<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор програміста</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<header class="page-header">
        <h1>Calculator <span>v1.0</span></h1>
</header>

<a href="auth.html" class="nav-box" style="top: 20px; left: 20px;">☰</a>

<a href="profile.html" class="nav-box" style="top: 80px; left: 20px;">웃</a>
<a href="calculator.html" class="nav-box" style="top: 140px; left: 20px;">Σ</a>
<a href="calculator_programer.html" class="nav-box" style="top: 200px; left: 20px;">&lt;/&gt;</a>

<a href="info.html" class="nav-box" style="bottom: 20px; left: 20px;">ⓘ</a>
<div class="side-line"></div>

<div class="calc-card p-2 bg-dark rounded">
    <div class="d-flex justify-content-between align-items-center px-2 mb-2">
        <div class="col-6 text-white fs-2 fw-bold">Programmer mode</div>
    </div>

    <div class="row mb-3">
        <div class="col-12 text-end text-white fs-1">0</div>
    </div>

    <div class="systems-panel mb-3">
        <div class="d-flex text-white-50 small py-1"><div class="sys-label">HEX</div><div>0</div></div>
        <div class="d-flex text-white py-1 active-sys"><div class="sys-label fw-bold">DEC</div><div>0</div></div>
        <div class="d-flex text-white-50 small py-1"><div class="sys-label">OCT</div><div>0</div></div>
        <div class="d-flex text-white-50 small py-1"><div class="sys-label">BIN</div><div>0</div></div>
    </div>

    <div class="d-flex justify-content-around text-white-50 mb-3 border-bottom border-secondary pb-2">
        <span>☰</span> <span>☷</span> <span>QWORD</span> <span>MS</span>
    </div>

    <div class="d-flex gap-4 text-white-50 small mb-3 px-2">
        <span>Bitwise ⌄</span> <span>Bit shift ⌄</span>
    </div>

    <div class="row g-1">
        <div class="col"><button class="my-btn btn-letter disabled">A</button></div>
        <div class="col"><button class="my-btn btn-op">«</button></div>
        <div class="col"><button class="my-btn btn-op">»</button></div>
        <div class="col"><button class="my-btn btn-op">C</button></div>
        <div class="col"><button class="my-btn btn-op">⌫</button></div>
    </div>
    <div class="row g-1">
        <div class="col"><button class="my-btn btn-letter disabled">B</button></div>
        <div class="col"><button class="my-btn btn-op">(</button></div>
        <div class="col"><button class="my-btn btn-op">)</button></div>
        <div class="col"><button class="my-btn btn-op">%</button></div>
        <div class="col"><button class="my-btn btn-op">÷</button></div>
    </div>
    <div class="row g-1">
        <div class="col"><button class="my-btn btn-letter disabled">C</button></div>
        <div class="col"><button class="my-btn btn-num">7</button></div>
        <div class="col"><button class="my-btn btn-num">8</button></div>
        <div class="col"><button class="my-btn btn-num">9</button></div>
        <div class="col"><button class="my-btn btn-op">×</button></div>
    </div>
    <div class="row g-1">
        <div class="col"><button class="my-btn btn-letter disabled">D</button></div>
        <div class="col"><button class="my-btn btn-num">4</button></div>
        <div class="col"><button class="my-btn btn-num">5</button></div>
        <div class="col"><button class="my-btn btn-num">6</button></div>
        <div class="col"><button class="my-btn btn-op">−</button></div>
    </div>
    <div class="row g-1">
        <div class="col"><button class="my-btn btn-letter disabled">E</button></div>
        <div class="col"><button class="my-btn btn-num">1</button></div>
        <div class="col"><button class="my-btn btn-num">2</button></div>
        <div class="col"><button class="my-btn btn-num">3</button></div>
        <div class="col"><button class="my-btn btn-op">+</button></div>
    </div>
    <div class="row g-1">
        <div class="col"><button class="my-btn btn-letter disabled">F</button></div>
        <div class="col"><button class="my-btn btn-num">+/-</button></div>
        <div class="col"><button class="my-btn btn-num">0</button></div>
        <div class="col"><button class="my-btn btn-num">,</button></div>
        <div class="col"><button class="my-btn btn-equal">=</button></div>
    </div>
</div>

<footer>
    Розроблено студентом <b>КВ-33</b> &copy; 2026
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
